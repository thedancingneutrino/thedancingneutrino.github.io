---
layout: default
---

{% assign chapter_page = nil %}
{% for p in site.pages %}
  {% if p.collection_key == page.collection %}
    {% assign chapter_page = p %}
    {% break %}
  {% endif %}
{% endfor %}

<article class="poem">
  <h1>{{ page.title }}</h1>

  <div class="poem-text">
    {{ content }}
  </div>
  {% if chapter_page %}
    <p class="back">
      <a href="{{ chapter_page.url }}">
        ← Back to {{ chapter_page.title }}
      </a>
    </p>
  {% endif %}
</article>
