---
layout: default
---

<h1>{{ page.title }}</h1>
<p>{{ content }}</p>

{% assign chapter_poems = site.pages
  | where: "layout", "poem"
  | where: "collection", page.collection_key
  | sort: "order" %}

<ul class="poem-list">
  {% for poem in chapter_poems %}
    <li>
      <a href="{{ poem.url }}">
        {{ poem.title }}
      </a>
    </li>
  {% endfor %}
</ul>
